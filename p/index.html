<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>KiloHills property</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: #eceaf6;
        color: #1c1b2e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #fff;
        border-radius: 28px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 18px 40px rgba(60, 50, 120, 0.12);
      }
      .brand { font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #5b5bd6; }
      h1 { font-size: 24px; line-height: 1.25; margin: 14px 0 6px; }
      p { margin: 0; font-size: 16px; color: #6b6a80; }
      .plate {
        display: none;
        margin: 22px auto 0;
        padding: 12px 18px;
        border-radius: 16px;
        background: #f3f2fb;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 1px;
      }
      .plate small { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0; color: #6b6a80; }
      .call {
        display: block;
        margin-top: 22px;
        padding: 16px;
        border-radius: 18px;
        background: #5b5bd6;
        color: #fff;
        font-size: 18px;
        font-weight: 700;
        text-decoration: none;
      }
      .call:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">KILOHILLS</div>
      <h1>This property belongs to KiloHills</h1>
      <p>If you found it, please call us.</p>
      <div class="plate" id="plate"><small>Plate number</small><span id="code"></span></div>
      <a class="call" href="tel:+250788325728">Call: +250 788 325 728</a>
    </main>
    <script>
      // The label's QR code opens this page with the plate number, e.g. ?c=001-CMP006
      var code = (new URLSearchParams(location.search).get('c') || '').toUpperCase();
      if (/^[A-Z0-9-]{1,24}$/.test(code)) {
        document.getElementById('code').textContent = code;
        document.getElementById('plate').style.display = 'inline-block';
        document.title = code + ' - KiloHills property';
      }
    </script>
  </body>
</html>
